  - id: t-001
    state: closed
    kind: bug
    title: "Auriga does its own zombie-detection/actuation — contradicts Hellsing's documented architecture, and it's malfunctioning"
    description: >
      GitHub issue #75 (mdostal/auriga#75). Auriga's router (detectZombies /
      isHiveCapableAssignee, src/router/lib/core.mjs:474) emits `zombie` events
      with action:"assign" every dispatch cycle when it finds a stale
      in_progress issue, and keeps re-firing indefinitely without ever
      resolving the underlying stuck task. Live example: PANT-48 stuck
      in_progress 3+ hours, zombie-flag fired every ~2min
      (reason:"hive-on-noncapable-lane") but never recovered it — operator had
      to manually reset the ticket as a workaround.

      Architectural conflict: pantheon-v2's plugins/hellsing/README.md states
      the dangerous actuation of terminating stuck processes belongs to
      Hellsing, with Auriga staying "a thin, event-driven state-machine
      consumer." Hellsing is phase:concept with no runnable code anywhere —
      Auriga is standing in for a god that doesn't exist, and doing it in a
      way that loops forever instead of resolving anything.

      Verified current against live repo 2026-09-04: detectZombies still
      detects+actuates every cycle with no terminate/give-up path.
    reproduction_steps: >
      Watch pantheon-auriga-1's router log across cycles: an in_progress
      issue with a stale/failed run repeatedly gets a `zombie` event with
      action:"assign" (or "rerun"), on repeat, without the issue ever leaving
      the stuck state or being escalated/terminated.
    reporter: "mdostal (GitHub issue #75, filed 2026-09-03T14:42:06Z, operator-authorized from the pantheon-v2 dogfooding nurse loop)"
    reported_at: "2026-09-03T14:42:06Z"
    priority: p1
