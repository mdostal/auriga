  - id: t-002
    state: closed
    kind: bug
    title: "dostal-tech dispatch loop stuck: PANT-4 thrashes done<->in_review every cycle, blocking all other backlog items"
    description: >
      GitHub issue #76 (mdostal/auriga#76). Per-tenant dispatch loop
      (pantheon-auriga-dostal-tech-1) stuck in an infinite loop on PANT-4
      (mdostal/pantheon-v2): every cycle the router detects it as done
      without review (kind:"false-done"), reverts it to in_review, dispatches
      a fresh review, and on the very next cycle it's back to done again —
      repeating for a long time (confirmed via revision 2442 on the ticket).
      assigned:0 and every inflight bucket sits at zero on every cycle — ~20
      other real backlog items (PANT-2,3,5-11,13,16-19,67,68,83,85-89, all
      todo, several unassigned for a week+) get zero attention.

      Suspected root cause: detectFalseDone (core.mjs:838) demotes a done
      issue back to in_review based on an openPrs scan, while
      detectVerifiedDone (core.mjs:446) advances it back to done based on a
      merged-PR check on the same linked PR (mdostal/heimdall#85, merged) —
      if the openPrs scan is stale or wrong, these two decisions can fight
      each other forever. Not a pantheon-v2/core-api bug — ruled out by
      querying Multica directly via CLI and seeing the same oscillation, and
      core-api's own logs showed nothing relevant during the window.
    reproduction_steps: >
      Watch `docker logs pantheon-auriga-dostal-tech-1 -f` for a few cycles —
      PANT-4 repeatedly shows advance...to in_review immediately followed by
      dispatch-review/review_dispatched, cycle after cycle, with assigned:0
      throughout.
    reporter: "mdostal (GitHub issue #76, filed 2026-09-04T14:22:12Z)"
    reported_at: "2026-09-04T14:22:12Z"
    priority: p0
    severity: critical
    linked_epic: t002-false-done-thrash-fix
    linked_story: t002-detect-false-done-merged-guard
    closed_reason: "shipped in PR (merged directly to main, commit a3e6ca4) — fixed in detectFalseDone (src/router/lib/core.mjs)"
