design_decisions:
  - decision: "Registry file at src/router/projects.json, sibling to package.json"
    rationale: "Operator sign-off — a router-level concern, parallel to how the p5 CLI's harness registrations aren't buried under lib/adapters/."
  - decision: "Migrate 5 entries (4 real PROJECT_IDS + Minerva), not just 4 or all 17"
    rationale: "Operator sign-off, resolving grill finding H1 — Minerva is dispatch-ineligible but routing-policy-load-bearing; migrating it avoids scan perpetually flagging an already-known project as undiscovered, without changing dispatch eligibility (it still isn't added to the derived PROJECT_IDS set)."
  - decision: "PROJECT_LANE (top-level per-project lane assignment) is in scope; deeper director-internal hierarchy is not"
    rationale: "Operator sign-off — Auriga's core orchestration job is knowing which lane/director handles a project's work; a director's own internal manager/coder/QA routing is that director's own configuration, a separate future concern."
  - decision: "Graceful degrade (warn + empty list) on a missing/malformed registry file, never throw"
    rationale: "Grill finding H2 — an unrelated existing test (spawn-adapter.test.mjs) imports this module directly; a new hard-crash failure mode for unrelated code would be a real regression, not an acceptable side effect of this epic."

cross_cutting:
  - concern: adapter-boundary-integrity
    action: "This story touches config.mjs (via config-substrate.mjs), triggering the concern per its own applies_when. Walked: the registry's add/remove/list operations are pure local state with no external-system call; the only external call (scan, in a later story) goes through the already-adapter-boundary-compliant listAllProjects() from p6-projects-list-adapter-extra. This relocates hardcoded values into a smaller, operator-mutable surface rather than eliminating hardcoding as a category — an honest framing, not an overclaim (grill U1)."
  - concern: documentation
    action: "New files (projects.json, project-registry.mjs) and a changed config-substrate.mjs behavior — add a .pHive/CONTEXT.md Key paths entry for the new registry files once landed"

risks:
  - severity: high
    description: "A migration bug in PROJECT_IDS or PROJECT_LANE could silently change real dispatch behavior or agent routing on the very first run after this ships"
    mitigation: "Hard merge gate: byte-identical verification tests for BOTH derived arrays, explicitly required by acceptance criteria, not optional or soft-failing"
  - severity: medium
    description: "Reading a file at ES module import time is a new pattern with no precedent; a crash here would break an unrelated existing test (spawn-adapter.test.mjs) that has nothing to do with this feature"
    mitigation: "Graceful degrade (warn + empty list, never throw) is a required, explicitly tested acceptance criterion, not an assumption"

