design_decisions:
  - decision: "add is idempotent (updates on re-registration) rather than erroring"
    rationale: "Operator sign-off, design-discussion.md Open Question 4 — one fewer command to remember, matches agent init's own idempotency precedent."
  - decision: "scan never auto-registers"
    rationale: "Operator's original explicit framing: scan is offered as a starting point/suggestion, registration is always a deliberate, separate operator action."

cross_cutting:
  - concern: documentation
    action: "New CLI subcommands — worth a one-line mention in README.md or CONTEXT.md once landed, alongside the existing agent init/status/mcp documentation from p5"

risks:
  - severity: low
    description: "A typo'd project id in `add` could silently register a bogus, non-existent project if not validated against a real scan"
    mitigation: "Acceptance criteria require add to validate against a fresh scan and fail clearly on an unrecognized id"

references:
