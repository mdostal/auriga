  - id: p6-registry-core
    title: Project registry storage + config-substrate.mjs derivation (PROJECT_NAMES/IDS/LANE)
    complexity: high
    depends_on: [p6-projects-list-adapter-extra]
  - id: p6-project-cli
    title: "auriga project scan/add/remove/list CLI commands"
    complexity: medium
    depends_on: [p6-registry-core]
