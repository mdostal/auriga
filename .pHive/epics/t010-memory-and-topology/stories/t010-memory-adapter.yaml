code_examples:
  - title: mnemosyne repo's own proven client contract (hooks/lib/mnemo-client.mjs)
    file: /Users/mdostal/Documents/work/pantheon/mnemosyne/hooks/lib/mnemo-client.mjs
    snippet: |
      export async function recall(query, scope, opts = {}) {
        const payload = { query, scope, hits: opts.hits || 5, escalate: !!opts.escalate };
        try {
          const r = await httpJson("POST", "/recall", payload);
          return { ...r, via: "service" };
        } catch (serviceErr) {
          try {
            const args = ["recall", String(query), "--json", "--hits", String(payload.hits)];
            if (scope) args.push("--scope", String(scope));
            const { stdout } = await cli(args);
            return { ...JSON.parse(stdout), via: "cli", service_error: String(serviceErr.message) };
          } catch (cliErr) {
            return { total_hits: 0, scopes: [], via: "none", ... };
          }
        }
      }

design_decisions:
  - decision: Direct-to-Mnemosyne integration now, not blocked on a Pantheon proxy.
    rationale: No such proxy exists in pantheon-v2's core-api today (verified live). Mirrors multica/backlog.mjs's own proven history (direct first, cut over once a real Pantheon proxy exists) rather than blocking real, requested work on infrastructure that doesn't exist yet.
  - decision: MemoryAdapter is async, unlike BacklogAdapter/SpawnAdapter.
    rationale: No synchronous cycle() consumer exists for it in this epic, and Mnemosyne's real transport is genuinely async -- forcing sync here would be premature interface-shaping with nothing to justify it.
  - decision: remember()'s CLI fallback is NOT ported from mnemo-client.mjs.
    rationale: That fallback path has a real side effect (writes a note file under the operator's home directory then indexes it) -- reproducing it here without its own story would be exactly the kind of scope creep the no-pre-emptive-integrations rule warns against.

risks:
  - severity: low
    description: A future Pantheon memory-proxy route would require cutting this adapter over, a real effort similar to the pantheon-v2-l2 cutover.
    mitigation: The file's own header comment flags this explicitly so a future session doesn't mistake this for the final, permanent shape.
