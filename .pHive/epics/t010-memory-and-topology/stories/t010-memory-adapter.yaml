id: t010-memory-adapter
epic: t010-memory-and-topology
title: MemoryAdapter contract + Mnemosyne-backed implementation + CLI
status: shipped
complexity: medium
methodology: classic
depends_on: []

description: |
  Operator (2026-09-05): "auriga has a way to load in context, data,
  memory, configs, etc -- so we should add a pre-load base memory, a
  fetch, etc call and we'll use mnemosyne for the integration but auriga
  could have different memory providers."

  No existing memory integration anywhere in this repo. Researched
  Mnemosyne's real, proven client contract (hooks/lib/mnemo-client.mjs in
  the mnemosyne sibling repo): HTTP service first (POST /recall, POST
  /remember, default :8477), swarm-memory CLI fallback second, never
  throws. Checked pantheon-v2's core-api live: no memory-proxy route
  exists yet (no /api/memory) -- only a persona_root_scope_id field on the
  tenant registry anticipating per-tenant Mnemosyne scoping, not a working
  proxy. Built this adapter direct-for-now, mirroring
  multica/backlog.mjs's own pre-pantheon-v2-l2 history (a real, load-
  bearing precedent for exactly this situation), explicitly flagged in
  the code as provisional pending a future Pantheon proxy.

acceptance_criteria:
  - "lib/adapters/memory-adapter.mjs defines the MemoryAdapter typedef (recall/remember), deliberately async (documented rationale: no cycle() consumer yet, unlike BacklogAdapter/SpawnAdapter's sync constraint)."
  - "lib/adapters/mnemosyne/memory.mjs's recall() tries the HTTP service first, falls back to the swarm-memory CLI on service failure, and never throws -- a total failure returns { total_hits: 0, scopes: [], via: 'none' }."
  - "lib/adapters/mnemosyne/memory.mjs's remember() tries the HTTP service only (no CLI fallback for writes, by design -- the real CLI fallback has a real side effect, writing a note file under the operator's home directory, that this adapter must not silently reproduce) -- service failure returns { remembered: false, via: 'none' }, never throws."
  - "lib/adapters/stub/memory.mjs provides an in-memory test double (substring-match recall, mutate-in-place remember) for zero-live-access testing."
  - "auriga memory recall <query> [--scope] [--hits] and auriga memory remember <text> [--scope] [--tag] CLI commands exist, defaulting scope to AURIGA_TENANT_ID || AURIGA_INSTANCE_ID || 'default'."
  - "AURIGA_MEMORY_ADAPTER=stub (+ optional AURIGA_STUB_MEMORY_SEED) lets CLI-level tests exercise these commands with zero live Mnemosyne service/CLI access, mirroring AURIGA_BACKLOG_ADAPTER=stub's established convention."
  - "This epic does NOT wire recall/remember into auriga-router.mjs's cycle() decision loop -- CLI-only for now, by explicit design."

