name: t010-memory-and-topology
title: Memory adapter (Mnemosyne-backed) + orchestrator topology registry
description: >
  Two related additions requested together: (1) a provider-agnostic
  MemoryAdapter contract with a real Mnemosyne-backed implementation
  (direct-for-now, mirroring multica/backlog.mjs's own pre-pantheon-v2-l2
  history) plus CLI recall/remember commands; (2) a pure-data orchestrator
  topology registry letting one Auriga instance be manually registered as
  another's parent or child, laying groundwork for the operator's
  multi-level orchestration vision without building any orchestration/
  handoff logic itself.
