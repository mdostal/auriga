name: t008-github-cli-dedup
title: Extract shared gh-CLI helper module, closing a real timeout drift bug
description: >
  Second of four agreed workstreams from the 2026-09-05 codebase-wide
  cleanup discussion. Extracts ghRun/ghListRepos/ghPrs/
  listCandidatePullRequests/gatherReviewRepos (hand-copied across
  multica/backlog.mjs and pantheon-v2-l2/index.mjs, plus a third in-file
  copy of the repo-gathering loop) into a shared
  src/router/lib/adapters/github-cli.mjs. Found and fixed a real, live
  drift bug in the process: multica/backlog.mjs's copy never received
  pantheon-v2-l2's 15s exec timeout fix (PANT-24/#70).
