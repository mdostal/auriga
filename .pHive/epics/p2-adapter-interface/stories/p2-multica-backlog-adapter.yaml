code_examples:
  - title: "cleanEnv() — the security-relevant env-scrubbing that MUST be preserved verbatim"
    file: src/router/lib/multica.mjs
    snippet: |
      function cleanEnv() {
        const e = { ...process.env };
        delete e.MULTICA_TOKEN;
        delete e.MULTICA_PAT_TOKEN;
        delete e.MULTICA_WORKSPACE_ID;
        return e;
      }
  - title: "listIssues pagination loop — preserve the offset-loop and 100k safety stop exactly"
    file: src/router/lib/multica.mjs
    snippet: |
      export function listIssues(projectId, pageSize = 200) {
        const all = [];
        for (let offset = 0; ; offset += pageSize) {
          const res = run(['issue', 'list', '--project', projectId, '--output', 'json',
            '--limit', String(pageSize), '--offset', String(offset)]);
          const page = (res && res.issues) || [];
          for (const i of page) all.push(i);
          if (page.length < pageSize) break;
          if (offset > 100000) break;
        }
        return all;
      }

design_decisions:
  - decision: "GitHub PR-discovery (ghOpenPrs/ghListRepos/ghPrs) folds into getIssuePullRequests on backlogAdapter, not a separate vcsAdapter"
    rationale: "Open Question 1 resolution (design-discussion.md): smaller diff, avoids an undocumented third adapter kind not present in north_star/CONTEXT.md's two-adapter model; revisit only if a second VCS is ever needed"
  - decision: "The 7-unmapped-project-names gap is carried forward unchanged, not fixed"
    rationale: "Explicitly out of scope per VISION.md — 'needs reconciliation with Minerva/operator,' not this epic's job"

cross_cutting:
  - concern: documentation
    action: "lib/config.mjs's structure changes (exports removed) — flag for the doc-impact review in p2-pantheon-l2-stub-and-docs's README.md updates"
  - concern: adapter-boundary-integrity
    action: "This adapter IS the sanctioned Multica-specific implementation — verify no OTHER file outside this one imports the multica/gh CLI directly after this story lands"

risks:
  - severity: high
    description: "getIssuePullRequests's internal gh-fallback logic could be ported incorrectly, silently returning empty instead of erroring — would look like 'no open PR' to the state machine and stall the review lane invisibly"
    mitigation: "Dedicated test case with a non-empty gh-mocked response, per structured-outline.md Part 2 Phase 2 Validation"
  - severity: medium
    description: "cleanEnv()'s token-scrubbing could be dropped or altered during the port"
    mitigation: "Explicit acceptance criterion + dedicated test asserting the three env vars are absent from the child process env"

