id: p2-multica-backlog-adapter
epic: p2-adapter-interface
title: Port lib/multica.mjs's issue CRUD + gh PR-discovery into createMulticaBacklogAdapter
status: done
complexity: medium
methodology: classic
depends_on: [p2-adapter-interfaces-and-stubs]

description: |
  Port lib/multica.mjs's read/write issue surface (listIssues, listAllProjectIds,
  getIssueRuns, setIssueStatus, commentOnIssue) AND its gh-backed PR discovery
  (ghOpenPrs/ghListRepos/ghPrs, folded into getIssuePullRequests) into
  createMulticaBacklogAdapter(cfg) — a behavior-preserving refactor, not a
  rewrite. Begin the lib/config.mjs substrate/policy split by extracting AGENTS,
  PROJECT_NAMES, PROJECT_IDS into lib/config-substrate.mjs, carrying the known
  "7 unmapped project names" gap forward byte-identical (not fixed). Tested in
  isolation against mocked CLI output — NOT wired into auriga-router.mjs yet.

acceptance_criteria:
  - "Given createMulticaBacklogAdapter(cfg) exists, when its methods are called against mocked multica/gh CLI output, then it implements every method in backlog-adapter.mjs's typedef with output matching today's lib/multica.mjs behavior"
  - "Given a project with more than one page of issues (mocked), when listIssues runs, then it paginates via --offset until a short page is returned, matching today's pagination loop exactly"
  - "Given cleanEnv() runs, when the child process env is inspected, then MULTICA_TOKEN, MULTICA_PAT_TOKEN, and MULTICA_WORKSPACE_ID are absent from it"
  - "Given lib/config-substrate.mjs exists, when diffed against today's lib/config.mjs AGENTS/PROJECT_NAMES/PROJECT_IDS exports, then the values are byte-identical including the KNOWN GAP comment"
  - "Given `npm test` runs, then all 6 pre-existing test files still pass unchanged (this story does not touch auriga-router.mjs, so nothing should regress)"

steps:
  - id: research
    description: Read lib/multica.mjs in full plus the mined status-mapping notes referenced in research-brief.md §4 (from commit f4847ee's src/engine/adapters/multica/index.ts) to ground the port
    agent: researcher
  - id: implement
    description: Implement src/router/lib/adapters/multica/backlog.mjs and lib/config-substrate.mjs per files_to_modify below
    agent: developer
    depends_on: [research]
  - id: test
    description: Write backlog-adapter.test.mjs extending test/support/mock-mca.mjs's pattern, covering pagination and cleanEnv() edge cases
    agent: tester
    depends_on: [implement]
  - id: review
    description: Review for behavior-preservation — every ported method's output must match lib/multica.mjs's existing behavior exactly, including error-handling asymmetry (reads degrade gracefully, writes propagate errors)
    agent: reviewer
    depends_on: [test]
  - id: integrate
    description: Commit and push to feat/p2-adapter-interface
    agent: developer
    depends_on: [review]

