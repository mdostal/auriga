name: t006-verified-done-casing-fix
title: Fix detectVerifiedDone's PR-state casing bug + extract a shared GitHub PR-state constants module
description: >
  Fixes GitHub issue #81: detectVerifiedDone never fired on a real merged PR
  because it compared against lowercase 'merged'/snake_case merged_at, while
  real gh-CLI PR objects use uppercase "MERGED"/camelCase mergedAt.
  Per operator discussion, extracted GitHub's real PullRequestState enum
  values and the timestamp-field spellings into a dedicated constants
  module (src/router/lib/github-pr-state.mjs) with shared isPrOpen/isPrMerged
  predicates, replacing three previously hand-copied, drifting versions of
  the same casing-normalization logic across core.mjs (prIsOpen,
  detectVerifiedDone, detectFalseDone's merged-PR guard).
