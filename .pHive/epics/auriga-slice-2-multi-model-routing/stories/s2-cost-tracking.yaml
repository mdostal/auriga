id: s2-cost-tracking
epic: auriga-slice-2-multi-model-routing
title: Add cost tracking and observability for multi-model dispatch
status: pending
complexity: medium
methodology: classic

description: |
  Instrument the router with cost tracking across all model backends. Each dispatch
  logs cost (tokens × per-token price), latency, success/failure. Aggregate metrics
  enable cost monitoring, budget alerts, and routing optimization analysis.

acceptance_criteria:
  - "Given successful dispatch, when adapter returns, then log cost = tokens × model.costPerToken"
  - "Given dispatch to any model, when completing, then emit metric with model name, latency, tokens, cost"
  - "Given hourly window, when querying metrics, then return total cost by model"
  - "Given cost exceeds threshold, when dispatching, then emit warning (future: circuit breaker)"
  - "Given routing decision, when logged, then include task type, selected model, fallback chain used"

steps:
  - id: research
    description: Review existing observability patterns in router codebase
    agent: researcher
  - id: implement
    description: Add cost calculation to BaseDispatchAdapter, create metrics aggregator module
    agent: developer
    depends_on: [research, s2-router-integration]
  - id: test
    description: Write tests for cost calculation, metrics emission, aggregation
    agent: tester
    depends_on: [implement]
  - id: review
    description: Review metrics correctness and cost calculation accuracy
    agent: reviewer
    depends_on: [test]
  - id: integrate
    description: Commit and push to feature branch
    agent: developer
    depends_on: [review]

