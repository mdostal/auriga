      purpose: Add cost calculation after each dispatch
    - path: src/auriga/model-registry.ts
      purpose: Cost-per-token metadata for each model

files_to_modify:
  - file: src/router/lib/metrics.mjs
    change: Create new module for cost/latency metric aggregation
  - file: src/router/adapters/BaseDispatchAdapter.ts
    change: Add cost calculation and logging after dispatch

code_examples:
  - title: Cost tracking in adapter
    snippet: |
      // In BaseDispatchAdapter.dispatch()
      async dispatch(prompt: string): Promise<DispatchResult> {
        const start = Date.now();
        const result = await this.performDispatch(prompt);
        const latency = Date.now() - start;

        const cost = result.tokens.total * this.model.costPerToken;
        this.logMetric({
          model: this.model.name,
          latency,
          tokens: result.tokens,
          cost
        });

        return result;
      }

design_decisions:
  - decision: Cost per token hardcoded in model registry
    rationale: Pricing changes infrequently, simpler than live API pricing lookups
  - decision: Metrics logged to stdout (JSON lines), not persisted
    rationale: Router is stateless, external log aggregator handles persistence
  - decision: No automatic circuit breaker on cost threshold in slice-2
    rationale: Warning only for now, circuit breaker deferred to future observability epic

risks:
  - severity: medium
    description: Token count from provider APIs may not match actual billing
    mitigation: Document metric is estimate, cross-check with provider invoices monthly

depends_on: [s2-router-integration]

parallel_allowed: false
