id: s2-dispatch-adapter-interface
epic: auriga-slice-2-multi-model-routing
title: Define dispatch adapter interface and base implementation
status: pending
complexity: low
methodology: classic

description: |
  Create the IDispatchAdapter interface that all model-specific adapters will
  implement. This abstraction allows the router to dispatch to any model backend
  without knowing provider-specific details. Include a base implementation with
  common functionality (retry logic, timeout handling, logging).

acceptance_criteria:
  - "Given a dispatch request, when calling adapter.dispatch(), then return standardized response shape"
  - "Given adapter initialization, when config is invalid, then throw descriptive error"
  - "Given network timeout, when dispatching, then retry with exponential backoff up to max attempts"
  - "Given successful dispatch, when response received, then log model name, latency, token count"

