code_examples:
  - title: Retry pattern from multica client
    file: src/router/lib/multica.mjs
    snippet: |
      // Adapt this retry pattern for BaseDispatchAdapter
      async function withRetry(fn, maxAttempts = 3) {
        for (let i = 0; i < maxAttempts; i++) {
          try {
            return await fn();
          } catch (err) {
            if (i === maxAttempts - 1) throw err;
            await sleep(Math.pow(2, i) * 1000);
          }
        }
      }

design_decisions:
  - decision: Use TypeScript interface + abstract base class pattern
    rationale: Interface defines contract, base class shares common logic across adapters
  - decision: Standardized response shape includes tokens, latency, cost
    rationale: Enables centralized observability and cost tracking
  - decision: Max 3 retry attempts with exponential backoff
    rationale: Balance reliability vs latency, matches multica client behavior

risks:
  - severity: medium
    description: Different providers may have incompatible response shapes
    mitigation: Adapters translate provider-specific responses to standard shape in their implementation

