code_examples:
  - title: Registry pattern from existing code
    file: src/auriga/registry.ts
    snippet: |
      // Follow this class structure for ModelRegistry
      export class ProjectRegistry {
        private projects: Map<string, ProjectConfig> = new Map();

        register(id: string, config: ProjectConfig): void {
          this.projects.set(id, config);
        }

        get(id: string): ProjectConfig | undefined {
          return this.projects.get(id);
        }
      }

design_decisions:
  - decision: Use TypeScript enum for ModelCapability
    rationale: Type-safe capability matching, easy to extend
  - decision: Hardcode model metadata initially, not config file
    rationale: Small set of models (3), easier to test, can externalize later
  - decision: Registry is singleton instance
    rationale: Single source of truth, consistent with existing registry.ts pattern

risks:
  - severity: low
    description: Model metadata may drift from actual provider capabilities
    mitigation: Document source of truth, add validation tests

