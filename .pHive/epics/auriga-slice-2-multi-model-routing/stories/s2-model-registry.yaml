id: s2-model-registry
epic: auriga-slice-2-multi-model-routing
title: Create model registry with capability profiles
status: pending
complexity: low
methodology: classic

description: |
  Build the foundational model registry that catalogs available LLM backends
  (Claude Sonnet/Opus, Codex, Gemini 2.0) with their capability profiles,
  rate limits, and cost metadata. This is the single source of truth for
  what models exist and what they can do.

acceptance_criteria:
  - "Given a model name, when querying the registry, then return its capability profile"
  - "Given a capability requirement (e.g., 'code-generation'), when querying, then return models that support it"
  - "Given the registry is loaded, when accessing model metadata, then cost-per-token and rate limits are available"
  - "Given invalid model name, when querying, then throw descriptive error"

