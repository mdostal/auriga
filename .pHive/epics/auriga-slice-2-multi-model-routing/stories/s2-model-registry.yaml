    depends_on: [research]
  - id: test
    description: Write tests covering registry queries, capability lookups, error cases
    agent: tester
    depends_on: [implement]
  - id: review
    description: Review implementation and tests for correctness
    agent: reviewer
    depends_on: [test]
  - id: integrate
    description: Commit and push to feature branch
    agent: developer
    depends_on: [review]

