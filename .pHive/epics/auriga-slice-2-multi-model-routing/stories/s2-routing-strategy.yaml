code_examples:
  - title: Selection logic structure
    snippet: |
      // model-selection.mjs exports this function
      export function selectModel(task, laneOverride, modelRegistry) {
        // 1. Lane override wins
        if (laneOverride) return validateModel(laneOverride);

        // 2. Task type affinity
        const preferred = getPreferredModel(task.type);
        if (modelRegistry.isAvailable(preferred)) return preferred;

        // 3. Fallback chain
        const chain = FALLBACK_CHAINS[preferred];
        for (const fallback of chain) {
          if (modelRegistry.isAvailable(fallback)) return fallback;
        }

        throw new NoAvailableModelError();
      }

design_decisions:
  - decision: Lane overrides take precedence over task type affinity
    rationale: Explicit operator intent should override heuristics
  - decision: Fallback chain is linear (not parallel best-of-N)
    rationale: Simpler, deterministic, lower cost than parallel dispatch
  - decision: Health checks cached for 60s per model
    rationale: Balance freshness vs overhead of constant health pings

risks:
  - severity: medium
    description: Incorrect task type classification may route to suboptimal model
    mitigation: Log all routing decisions for post-hoc analysis, tune affinity rules based on metrics

depends_on: [s2-model-registry]

parallel_allowed: false
