title: Implement model selection routing strategy
status: pending
complexity: high
methodology: classic

description: |
  Build the routing strategy layer that decides which model backend to use for
  each task. This is the decision engine that maps task characteristics (type,
  complexity, lane) to model selection, with fallback chains for reliability.

acceptance_criteria:
  - "Given a task with type=code-generation, when selecting model, then prefer Codex over Claude"
  - "Given a task with type=reasoning, when selecting model, then prefer Claude Opus over Gemini"
  - "Given primary model unavailable (health check fails), when selecting, then use next in fallback chain"
  - "Given lane override MODEL=gemini, when selecting, then use Gemini regardless of task type"
  - "Given all models in chain unavailable, when selecting, then throw NoAvailableModelError"

