id: s2-end-to-end-validation
epic: auriga-slice-2-multi-model-routing
title: End-to-end validation — multi-model dispatch produces working results
status: pending
complexity: high
methodology: classic

description: |
  Validate the complete multi-model routing flow end-to-end. Run router against
  live Multica board with tasks routed to Claude, Codex, and Gemini. Verify each
  model produces correct output, fallback chains work, cost tracking is accurate,
  and zero regressions vs single-backend router.

acceptance_criteria:
  - "Given router running with multi-model config, when code-gen task dispatched, then Codex produces valid code"
  - "Given router running, when reasoning task dispatched, then Claude Opus produces correct analysis"
  - "Given Claude primary unavailable, when fallback triggered, then Gemini completes task successfully"
  - "Given 100 tasks dispatched across 3 models, when checking metrics, then total cost within 10% of expected"
  - "Given comparison run single-backend vs multi-model, when measuring throughput, then ≤5% latency increase"

steps:
  - id: research
    description: Identify test tasks for each model type (code-gen, reasoning, mixed)
    agent: researcher
  - id: implement
    description: Create integration test suite running router against live/staging board
    agent: developer
    depends_on: [research, s2-cost-tracking]
  - id: test
    description: Execute end-to-end tests, validate outputs, check cost metrics, compare vs baseline
    agent: tester
    depends_on: [implement]
  - id: review
    description: Review test results, approve production rollout or flag issues
    agent: reviewer
    depends_on: [test]
  - id: integrate
    description: Commit validation suite, merge feature branch to dev
    agent: developer
    depends_on: [review]

