code_examples:
  - title: Validation test structure
    snippet: |
      // tests/integration/multi-model-validation.test.mjs
      import { test } from 'node:test';
      import assert from 'node:assert';

      test('code-gen task routes to Codex and produces valid code', async () => {
        const router = initRouter({ modelPrefs: { 'code-generation': 'codex' } });
        const task = { type: 'code-generation', prompt: 'write quicksort in Python' };
        const result = await router.dispatch(task);

        assert.strictEqual(result.model, 'codex');
        assert.match(result.output, /def quicksort/);
        assert.ok(result.cost > 0);
      });

design_decisions:
  - decision: Validation runs against staging Multica board, not production
    rationale: Prevent test tasks polluting production board
  - decision: Manual approval gate before production rollout
    rationale: High-risk change (routing all tasks), human verification required
  - decision: Keep validation suite as permanent regression test
    rationale: Future changes can run this suite to verify multi-model still works

risks:
  - severity: high
    description: Production rollout may have unforeseen model compatibility issues
    mitigation: Canary deployment (10% traffic), rollback plan ready, extensive staging validation

depends_on: [s2-cost-tracking]

parallel_allowed: false
