id: s2-gemini-adapter
epic: auriga-slice-2-multi-model-routing
title: Implement Gemini dispatch adapter
status: pending
complexity: medium
methodology: classic

description: |
  Create the GeminiAdapter implementation for Google Gemini 2.0 API. This adapter
  handles tasks routed to Gemini, translating router requests into Gemini API
  calls and normalizing responses to the standard adapter shape.

acceptance_criteria:
  - "Given a task with model=gemini-2.0-flash, when dispatching, then call Gemini API with correct parameters"
  - "Given Gemini API returns response, when parsing, then extract content, tokens, safety ratings"
  - "Given Gemini API returns 429 rate limit, when dispatching, then retry via base adapter"
  - "Given invalid GOOGLE_API_KEY, when initializing, then throw AuthenticationError"
  - "Given reasoning task routed to Gemini, when dispatch succeeds, then return structured output"

steps:
  - id: research
    description: Research Google Gemini API endpoint, auth, request/response format
    agent: researcher
  - id: implement
    description: Create src/router/adapters/GeminiAdapter.ts extending BaseDispatchAdapter
    agent: developer
    depends_on: [research, s2-dispatch-adapter-interface]
  - id: test
    description: Write tests for success path, rate limit, auth failure, safety filter handling
    agent: tester
    depends_on: [implement]
  - id: review
    description: Review Gemini integration and response normalization
    agent: reviewer
    depends_on: [test]
  - id: integrate
    description: Commit and push to feature branch
    agent: developer
    depends_on: [review]

context:
  codebase: /Users/dostal/.minerva/runs/192625f4-c271-432e-aede-f68ee99f5a20/workspace
  tech_stack:
    language: TypeScript
    runtime: Node.js
    api: Google Gemini API
  key_files:
    - path: src/router/adapters/BaseDispatchAdapter.ts
      purpose: Parent class providing retry/timeout/logging
    - path: src/auriga/model-registry.ts
      purpose: Defines Gemini capability profile

files_to_modify:
  - file: src/router/adapters/GeminiAdapter.ts
    change: Create new adapter implementing IDispatchAdapter for Gemini API
  - file: src/router/adapters/index.ts
    change: Export GeminiAdapter

code_examples:
  - title: Gemini API request shape
    snippet: |
      // GeminiAdapter.dispatch() calls Gemini like this
      const response = await fetch(
        `https://generativelanguage.googleapis.com/v1/models/gemini-2.0-flash:generateContent?key=${this.apiKey}`,
        {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: prompt }] }],
            generationConfig: { maxOutputTokens: 2048 }
          })
        }
      );

design_decisions:
  - decision: Adapter reads GOOGLE_API_KEY from env
    rationale: Standard Google Cloud client pattern
  - decision: Use gemini-2.0-flash model
    rationale: Balance of speed and capability per Google docs
  - decision: Handle safety filter blocks gracefully
    rationale: Gemini may block certain content; adapter returns empty response + log warning

risks:
  - severity: low
    description: Safety filters may block legitimate code/technical content
    mitigation: Log blocked requests for manual review, consider filter threshold tuning

depends_on: [s2-dispatch-adapter-interface]

parallel_allowed: true
parallel_rationale: variation
