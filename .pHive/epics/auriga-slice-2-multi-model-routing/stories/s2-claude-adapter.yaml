id: s2-claude-adapter
epic: auriga-slice-2-multi-model-routing
title: Implement Claude dispatch adapter
status: pending
complexity: medium
methodology: classic

description: |
  Create the ClaudeAdapter implementation that wraps the existing Claude API
  client logic. This adapter translates router dispatch requests into Claude
  Messages API calls and normalizes responses back to the standard adapter shape.
  Preserves backward compatibility with current single-backend routing.

acceptance_criteria:
  - "Given a task with model=claude-sonnet, when dispatching, then call Claude Messages API with correct parameters"
  - "Given Claude API returns 200, when parsing response, then extract tokens, completion, latency"
  - "Given Claude API returns 429 rate limit, when dispatching, then retry with backoff via base adapter"
  - "Given Claude API auth fails, when initializing, then throw AuthenticationError with actionable message"
  - "Given existing router dispatch, when switching to ClaudeAdapter, then zero behavior change"

steps:
  - id: research
    description: Identify current Claude API call sites in router codebase
    agent: researcher
  - id: implement
    description: Create src/router/adapters/ClaudeAdapter.ts extending BaseDispatchAdapter
    agent: developer
    depends_on: [research, s2-dispatch-adapter-interface]
  - id: test
    description: Write tests covering success path, rate limit retry, auth failure, token counting
    agent: tester
    depends_on: [implement]
  - id: review
    description: Review adapter implementation and backward compatibility
    agent: reviewer
    depends_on: [test]
  - id: integrate
    description: Commit and push to feature branch
    agent: developer
    depends_on: [review]

context:
  codebase: /Users/dostal/.minerva/runs/192625f4-c271-432e-aede-f68ee99f5a20/workspace
  tech_stack:
    language: TypeScript
    runtime: Node.js
    api: Anthropic Messages API
  key_files:
    - path: src/router/adapters/BaseDispatchAdapter.ts
      purpose: Parent class providing retry/timeout/logging
    - path: src/router/lib/core.mjs
      purpose: Current dispatch logic to refactor into ClaudeAdapter

files_to_modify:
  - file: src/router/adapters/ClaudeAdapter.ts
    change: Create new adapter implementing IDispatchAdapter for Claude API
  - file: src/router/adapters/index.ts
    change: Export ClaudeAdapter

code_examples:
  - title: Messages API request shape
    snippet: |
      // ClaudeAdapter.dispatch() will call Messages API like this
      const response = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: {
          'x-api-key': this.apiKey,
          'anthropic-version': '2023-06-01',
          'content-type': 'application/json'
        },
        body: JSON.stringify({
          model: 'claude-sonnet-4-5',
          max_tokens: 4096,
          messages: [{ role: 'user', content: prompt }]
        })
      });

design_decisions:
  - decision: Adapter reads ANTHROPIC_API_KEY from env
    rationale: Matches existing auth pattern, supports CI/container deployment
  - decision: Model selection (sonnet vs opus) handled by routing layer, not adapter
    rationale: Adapter receives specific model string, keeping it decoupled from strategy
  - decision: Preserve existing router behavior exactly when using ClaudeAdapter
    rationale: Zero-regression requirement for slice-2 rollout

risks:
  - severity: low
    description: API key rotation may break running router
    mitigation: Health check at adapter initialization detects missing/invalid key early

depends_on: [s2-dispatch-adapter-interface]

parallel_allowed: false
