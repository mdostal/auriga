      Open Question 1 resolved: fully read-only v1.
  - path: .pHive/epics/p5-agent-mcp-integration/docs/research-brief.md
    relevant_excerpt: |
      Section 1 (Portunus's MCP server, FastMCP, stdio, direct in-process calls) and
      Section 2 (the confirmed backlogAdapter gap and src/server/ unsuitability).
