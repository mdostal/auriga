design_decisions:
  - decision: "Registration check for Claude Code uses `claude mcp get auriga`, not `claude mcp list`"
    rationale: "Portunus already hit and fixed this exact bug — `mcp list` health-checks every registered MCP server, 30+ seconds on a machine with several configured. Confirmed via research reading Portunus's actual code and comments. No need to rediscover this."
  - decision: "Verification for this story uses `npm link`, not the public install.sh path"
    rationale: "Resolves grill finding U1 (real chicken-and-egg: install.sh, which provides the public PATH-provisioning, is a later story). npm link is the standard Node mechanism for local dev-time PATH provisioning and does not block this story on p5-install-script."

cross_cutting:
  - concern: documentation
    action: "This introduces a genuinely new file (the auriga CLI bin) worth a Key paths entry in .pHive/CONTEXT.md once landed"

risks:
  - severity: medium
    description: "claude mcp add / codex mcp add mutate the operator's real, live, already-in-daily-use tool config; an interrupted cycle (crash, timeout) could leave it half-registered"
    mitigation: "Verification runs human-watched, not unattended. Teardown is independently re-verified via a follow-up status check, not assumed successful from exit code alone."
  - severity: low
    description: "Operator's ~/.claude or codex config may be under external management (sync tooling, policy) not accounted for here"
    mitigation: "Not deeply investigated — named as a live assumption. If registration behaves unexpectedly on this machine, surface it rather than silently retrying or working around it."

