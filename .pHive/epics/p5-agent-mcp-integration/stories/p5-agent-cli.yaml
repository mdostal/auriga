  - file: src/router/lib/agent-setup.mjs
    change: "CREATE — detectHarnesses(), mcpRegistered(harness) [claude: `claude mcp get auriga`, codex: `codex mcp list`], registerMcp(harness), agentInit(), agentStatus() — mirrors Portunus's agent_setup.py shape adapted to Node"
  - file: src/router/package.json
    change: "MODIFY — add `auriga: ./bin/auriga.mjs` to the existing bin field"
  - file: src/router/test/agent-setup.test.mjs
