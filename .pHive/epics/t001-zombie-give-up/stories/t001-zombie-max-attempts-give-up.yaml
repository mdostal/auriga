id: t001-zombie-max-attempts-give-up
epic: t001-zombie-give-up
title: Cap zombie-recovery attempts via run count and emit a give-up action
status: shipped
complexity: low
methodology: classic
depends_on: []

description: |
  GitHub issue #75 (mdostal/auriga#75, triage t-001). Auriga's
  `detectZombies` (src/router/lib/core.mjs, ~line 474) detects a stale
  `in_progress` issue and pushes an `assign`/`rerun` action every single
  cycle, forever, without ever resolving the underlying stuck task. Live
  example: PANT-48 stuck 3+ hours, the zombie flag fired every ~2 minutes
  with `reason: "hive-on-noncapable-lane"` and never recovered it.

  Architectural context (see docs/design-discussion.md for the full
  reasoning): pantheon-v2's plugins/hellsing/README.md documents that
  "the dangerous actuation of terminating stuck processes" belongs to a
  separate god (Hellsing), with Auriga staying "a thin, event-driven
  state-machine consumer." Hellsing is phase:concept with no runnable code
  anywhere. DECISION: Auriga keeps bounded zombie-recovery attempts (a
  stuck story with zero recovery attempts is worse than one Auriga tries a
  bounded number of times) but must stop retrying UNBOUNDED — that
  indefinite-retry behavior is the actual scope-creep/malfunction the issue
  flags, not the recovery attempt itself. Auriga also has no capability to
  terminate a stuck process (no such SpawnAdapter method exists, and this
  story does not add one — see src/router/lib/adapters/README.md's
  no-pre-emptive-integrations rule) — real process termination stays
  Hellsing's job once it exists.

  Fix: `detectZombies` already receives `runsByIssue` (the issue's run
  history) as an argument — use its length as a stateless attempt counter
  (no new persistent state). Add `cfg.CAPS.zombieMaxAttempts` (new config
  field, default 3) to config.mjs, alongside the existing `zombieStaleMs`.
  Once an issue's run count reaches that cap, `detectZombies` must emit a
  `give-up` action instead of `assign`/`rerun` for that issue.

  `auriga-router.mjs`'s zombie-recovery block (~line 479-501) must handle
  the `give-up` action distinctly: log a `zombie_give_up` event (must never
  call `spawn.assignIssue`/`spawn.rerunIssue` for that action) and
  best-effort call `backlog.commentOnIssue(identifier, <clear message>)`
  wrapped in try/catch (matching this file's existing
  try/catch-and-continue convention for comment/log side effects — a
  comment failure must never throw or block the cycle).

acceptance_criteria:
  - "Given an in_progress stale issue with run count below cfg.CAPS.zombieMaxAttempts, when detectZombies runs, then it still emits assign/rerun exactly as before (no regression on the existing, working recovery path)."
  - "Given an in_progress stale issue with run count AT OR ABOVE cfg.CAPS.zombieMaxAttempts, when detectZombies runs, then it emits a give-up action instead of assign/rerun for that issue."
  - "Given a give-up action, when the router processes it, then it does NOT call spawn.assignIssue or spawn.rerunIssue for that issue, DOES log a zombie_give_up event, and best-effort calls backlog.commentOnIssue without letting a comment failure crash the cycle."
  - "cfg.CAPS.zombieMaxAttempts has a sane default (3) in config.mjs, following the exact placement/style convention of the existing zombieStaleMs field."
  - "All existing tests for detectZombies and the router's zombie-recovery block still pass unmodified."

steps:
  - id: implement
    description: >
      Add cfg.CAPS.zombieMaxAttempts (default 3) to src/router/lib/config.mjs
      next to zombieStaleMs. Add the attempt-cap check + give-up action to
      detectZombies in src/router/lib/core.mjs, with a code comment
      documenting the Hellsing boundary decision (bounded stopgap now,
      Hellsing takes over real actuation later — see design-discussion.md).
      Add the give-up branch to auriga-router.mjs's zombie-recovery block
      (~line 479-501): log zombie_give_up, best-effort commentOnIssue,
      never call spawn.assignIssue/rerunIssue for that action.
    agent: developer
  - id: test
    description: >
      Add test cases: (1) run count below cap -> assign/rerun unchanged
      (no regression), (2) run count at/above cap -> give-up action emitted
      instead, in core.test.mjs for detectZombies. Add or extend a
      router-level test (check what test file already covers the zombie
      block, likely router-cycle.e2e.test.mjs or similar) confirming a
      give-up action never triggers spawn.assignIssue/rerunIssue and does
      call commentOnIssue best-effort. Run the repo's real test command
      (npm test from repo root) and confirm the FULL suite is green, not
      just the new cases. Paste the actual output.
    agent: developer
    depends_on: [implement]
  - id: integrate
    description: >
      Commit on branch feat/t001-zombie-give-up with a clear message
      referencing GitHub issue #75. Do not open a PR, do not merge, do not
      push. The orchestrator handles verification, PR, and merge after this
      story completes.
    agent: developer
    depends_on: [test]

