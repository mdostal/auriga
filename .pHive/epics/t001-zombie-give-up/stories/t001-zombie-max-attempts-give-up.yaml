design_decisions:
  - decision: Use runsByIssue.length as the attempt counter instead of new persistent state.
    rationale: detectZombies already receives runsByIssue; every assign/rerun creates a new run entry, so it's a natural, stateless, already-available signal — matches this file's existing pure-function style (no external state).
  - decision: give-up does NOT attempt to terminate the underlying process — only stops re-actuating and leaves a comment.
    rationale: Auriga has no SpawnAdapter method for process termination and adding one would be a pre-emptive integration ahead of a real consumer (adapters/README.md rule); real termination stays Hellsing's documented job.

risks:
  - severity: low
    description: A legitimately slow-but-eventually-successful task could hit the attempt cap and stop being retried before it would have succeeded on a later attempt.
    mitigation: Default cap of 3 with zombieStaleMs already at 20 minutes means ~60+ minutes of retry budget before giving up — matches the scale of the observed 3+ hour PANT-48 stall this issue reports; still logged/commented, not silently dropped, so a human can manually rerun if needed.

references:
  - path: src/router/lib/config.mjs
    relevant_excerpt: |
      zombieStaleMs: 20 * 60 * 1000, // 20 min
