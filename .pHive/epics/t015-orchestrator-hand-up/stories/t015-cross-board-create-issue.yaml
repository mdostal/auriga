id: t015-cross-board-create-issue
epic: t015-orchestrator-hand-up
title: Add createIssue capability + parent reachability config
status: pending
complexity: medium
methodology: classic
depends_on: []

description: |
  Foundation layer for t015's hand-up logic: a genuinely new BacklogAdapter capability
  (createIssue — every existing method acts on an EXISTING issue, none create one) plus
  the config plumbing to know WHERE to create it (the parent's board reachability).

  Real endpoint confirmed live 2026-09-06 (cross-session peer pantheon-v2-6e, read
  directly from core/api/backlog.ts lines 165-185): POST /api/backlog/issues exists.
  Body: { title (required), description?, status?, labels?, metadata?, parent?, project? }
  -- field is `project`, not `project_id` (BoardQueue port's own naming). Response: 201
  with the created issue, 502 with {error} on backend failure. Thin passthrough handler
  (getBoard().create(request.body)), no auth beyond the required-title check.

acceptance_criteria:
  - "BacklogAdapter typedef (backlog-adapter.mjs) documents a new createIssue(ticketInfo) => object method."
  - "pantheon-v2-l2/index.mjs implements createIssue: POST /api/backlog/issues with { title, description, project, labels, metadata, parent }, response passed through the file's existing toRawIssue() mapper so core.mjs sees the same snake_case shape as every other read from this adapter."
  - "multica/backlog.mjs implements createIssue if `multica issue create` (or equivalent) is a real CLI subcommand -- verify against the actual CLI (`multica issue --help` or existing docs) before implementing; if no create subcommand exists, createIssue throws a clear 'not supported by this adapter' error rather than guessing a wrong invocation. Document whichever is true in this file's own header comment."
  - "stub/backlog.mjs implements createIssue as a straightforward in-memory push onto the stub's own issue list, returning a fabricated identifier, for use by tests and by t015-hand-up-routing's own test suite."
  - "orchestrator-topology.mjs's setParent()/addChild() accept optional baseUrl/projectId fields, stored in orchestrator-topology.json alongside id/notes; readTopologyFile/writeTopologyFile pass them through unchanged (no new validation beyond what already exists for id/notes)."
  - "A new resolveParentBoardConfig(topology, externalConfig) function (orchestrator-topology.mjs or a new small sibling module) returns { baseUrl, projectId } | null: prefers externalConfig.parentBoard (AURIGA_CONFIG's parentBoard block, read via the existing loadExternalConfig()) when both baseUrl and projectId are present there; else falls back to topology.parent's own baseUrl/projectId when both are present there; else null (no real destination configured)."
  - "New tests: createIssue's real-shape correctness for pantheon-v2-l2 (mocked execFileSync/curl -- asserts the exact path/method/body sent and the toRawIssue()-mapped return value), createIssue for the stub adapter, the topology setParent/addChild field pass-through, and resolveParentBoardConfig's three cases (AURIGA_CONFIG wins, topology-only fallback, neither present -> null)."

