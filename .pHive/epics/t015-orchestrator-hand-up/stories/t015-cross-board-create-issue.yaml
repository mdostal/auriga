    description: >
      Confirm whether `multica issue create` (or an equivalent subcommand) exists in the
      real multica CLI before writing multica/backlog.mjs's createIssue -- do not guess
      subcommand syntax. If genuinely unconfirmable this session, implement the
      throws-not-supported fallback instead and note why in the file's header comment.
    agent: researcher
  - id: implement
    description: >
      Add createIssue to backlog-adapter.mjs's typedef, pantheon-v2-l2/index.mjs (real,
      per the confirmed endpoint shape above), multica/backlog.mjs (per research step
      findings), and stub/backlog.mjs. Extend orchestrator-topology.mjs's setParent/
      addChild with baseUrl/projectId fields and add resolveParentBoardConfig.
    agent: developer
    depends_on: [research]
  - id: test
    description: >
