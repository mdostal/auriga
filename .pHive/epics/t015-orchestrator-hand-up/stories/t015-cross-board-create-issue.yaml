      and confirm full green.
    agent: developer
    depends_on: [implement]
  - id: review
    description: Review implementation and tests for correctness and convention compliance.
    agent: reviewer
    depends_on: [test]
  - id: integrate
    description: Commit on branch feat/t015-orchestrator-hand-up.
    agent: developer
    depends_on: [review]

context:
  codebase: /Users/mdostal/Documents/work/pantheon/auriga
  key_files:
    - path: src/router/lib/adapters/pantheon-v2-l2/index.mjs
      purpose: "createPantheonV2L2BacklogAdapter(cfg) already takes exactly { baseUrl, project, ... } -- reaching the parent's board is a SECOND instance of this same adapter, no new adapter type needed."
      relevant_excerpt: |
        export function createPantheonV2L2BacklogAdapter(cfg = {}) {
          const BASE_URL = (cfg.baseUrl || process.env.PANTHEON_API_URL || DEFAULT_BASE_URL).replace(/\/+$/, '');
    - path: src/router/lib/adapters/pantheon-v2-l2/http-runner.mjs
      purpose: "makeHttpRun(execFileSync, baseUrl) returns httpRun(method, path, body) -- createIssue is just run('POST', '/api/backlog/issues', {...})."
    - path: src/router/lib/orchestrator-topology.mjs
      purpose: t010's pure-data registry this story extends with reachability fields.
    - path: src/router/lib/config-loader.mjs
      purpose: "loadExternalConfig() already reads AURIGA_CONFIG generically -- reuse directly, read externalConfig.parentBoard, no changes needed to this file itself."
