design_decisions:
  - decision: createIssue targets a board via cfg (baseUrl/project), not a topology id directly.
    rationale: Keeps the adapter itself topology-agnostic (it already only knows baseUrl/project) -- topology resolution (which baseUrl/project a given parent id maps to) is a separate, pure concern handled by resolveParentBoardConfig, not baked into the adapter.
  - decision: AURIGA_CONFIG's parentBoard block takes precedence over topology.json's own baseUrl/projectId fields.
    rationale: Matches the operator's explicit "both, combined" answer -- AURIGA_CONFIG is the existing per-tenant deployment-config mechanism (already used for CAPS/PROJECT_LANE), so an operator managing many tenant deployments can keep parent-reachability alongside every other per-tenant override rather than hand-editing topology.json per instance.

risks:
  - severity: medium
    description: The real POST /api/backlog/issues endpoint could still reject a request shape this story assumes correct (confirmed via source read, not a live test call) -- e.g. an undocumented required field beyond title.
    mitigation: Endpoint shape was read directly from core-api's real source by a peer with live access, not guessed; the handler is a thin passthrough with no validation beyond the required-title check per that same read. Full live verification (an actual cross-tenant hand-up in production) is separate, Pantheon-owned follow-up work, consistent with this repo's existing "no live Multica testing" convention -- unit tests here are against mocked responses matching the confirmed real shape.
