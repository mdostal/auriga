files_to_modify:
  - file: src/ui/src/index.css
    change: "MODIFY — replace the current light shadcn theme tokens with Star Atlas's deep-space palette + CSS custom properties"
  - file: src/ui/tailwind.config.js
    change: "MODIFY — font family tokens for the serif/geometric-sans/mono pairing, color tokens if needed"
  - file: src/ui/src/views/EpicsListView.jsx
    change: "MODIFY — visual restyle to Star Atlas card/table treatment, status glyphs matching the design source"
  - file: src/ui/src/views/StoryDetailView.jsx
    change: "MODIFY — visual restyle PLUS the dependency constellation diagram (new, replacing the plain chip list)"
  - file: src/ui/src/views/ActivityView.jsx
    change: "MODIFY — visual restyle to Star Atlas's Observation Log timeline treatment"
  - file: src/ui/index.html
    change: "MODIFY — favicon link updated to the Charioteer's Pentagon mark (as an inline SVG data URI or a new asset file, whichever fits the existing setup)"
  - file: src/ui/tests/e2e/*.spec.js
    change: "MODIFY (only if needed) — update selectors broken by markup changes; do not change asserted scenarios"

design_decisions:
  - decision: "Tab navigation from the current implementation is kept; Concept B's long-scroll Plates structure is NOT adopted for the real dashboard"
    rationale: "Explicit operator direction: 'turn the one long page into tabs to make it an easier dashboarding tool' — the showcase page (separate story) gets the scroll treatment, the real tool gets tabs"
  - decision: "This is a visual-token/component restyle, not a rewrite"
    rationale: "src/ui/ already has a working, tested, hardened implementation (p3-auriga-ui) — reuse its structure and data-fetching logic entirely, change only how it looks"

cross_cutting: []

risks:
  - severity: medium
    description: "Restyling could silently break the existing Playwright test suite's selectors (e.g. tests that select by a shadcn class name or specific text that changes)"
    mitigation: "Acceptance criteria require the full existing suite (3 real-data + 4 hardening specs) to keep passing, with selector updates allowed but asserted scenarios unchanged — same rule used throughout this project's prior restructuring work"
  - severity: low
    description: "The constellation dependency diagram is new, custom SVG/CSS work adapted from a static mockup — the real view needs it to work for ANY number of dependencies (0, 1, many), not just the 2-dependency example the mockup showed"
    mitigation: "Explicitly test with a 0-dependency story and a story with more than 2 dependencies (check real story YAMLs in .pHive/epics/ for examples), not just the p2-router-cutover case the mockup used"

references:
  - path: .pHive/epics/p4-auriga-branding/epic.yaml
    relevant_excerpt: |
      Full synthesis context and both reference artifact paths.
